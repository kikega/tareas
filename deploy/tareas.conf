upstream tareas_app {
    server unix:/tmp/tareas.sock fail_timeout=0;
}

server {
    listen 80;
    server_name tareas.srvdebian;

    client_max_body_size 10M;

    location /static/ {
        alias /home/kike/Proyectos/Django/tareas/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /home/kike/Proyectos/Django/tareas/media/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/tmp/tareas.sock;
    }
}
