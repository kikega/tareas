<dialog id="subtask-edit-modal" class="backdrop:bg-zinc-950/85 backdrop:backdrop-blur-sm bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-2xl text-zinc-100 max-w-lg w-full focus:outline-none">
    <div class="flex justify-between items-center mb-6">
        <h3 class="text-lg font-bold text-white flex items-center">
            <i class="fa-solid fa-pen-to-square text-brand-500 mr-2.5"></i>
            Editar Subtarea
        </h3>
        <button onclick="document.getElementById('subtask-edit-modal').close()" class="text-zinc-500 hover:text-zinc-200 transition">
            <i class="fa-solid fa-xmark text-lg"></i>
        </button>
    </div>

    <form hx-post="{% url 'subtask_edit' subtask.id %}"
          hx-target="#subtask-item-{{ subtask.id }}"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful){document.getElementById('subtask-edit-modal').close()}"
          class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="subtask-title" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Título de la Subtarea</label>
            <input type="text" name="title" id="subtask-title" value="{{ subtask.title }}" required 
                   class="w-full px-4 py-3 border border-zinc-800 bg-zinc-950 rounded-xl text-zinc-100 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition duration-200">
        </div>

        <div>
            <label for="subtask-description" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Descripción (Markdown)</label>
            <textarea name="description" id="subtask-description" rows="5"
                      class="w-full px-4 py-3 border border-zinc-800 bg-zinc-950 rounded-xl text-zinc-100 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm transition duration-200 font-mono"
                      placeholder="# Detalles de la subtarea...">{{ subtask.description }}</textarea>
        </div>

        <div class="flex space-x-3 pt-2">
            <button type="submit" 
                    class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 px-4 rounded-xl text-sm transition duration-200 shadow-md">
                Guardar Cambios
            </button>
            <button type="button" onclick="document.getElementById('subtask-edit-modal').close()"
                    class="bg-zinc-800 hover:bg-zinc-750 text-zinc-350 font-semibold py-3 px-4 rounded-xl text-sm transition duration-200">
                Cancelar
            </button>
        </div>
    </form>
</dialog>

<script>
    document.getElementById('subtask-edit-modal').showModal();
</script>
